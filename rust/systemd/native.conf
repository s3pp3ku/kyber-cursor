[Service]
Environment=LD_PRELOAD=
ExecStart=
ExecStart=%h/.local/share/kyber-cursor/rust/kyber-ignite --native-runtime %h/.cache/kyber-cursor/native %h/.local/share/kyber-cursor/rust/kyber-native.so
ExecStop=/usr/bin/hyprctl plugin unload %h/.local/share/kyber-cursor/rust/kyber-native.so
ReadWritePaths=%h/.cache/kyber-cursor/native
TimeoutStopSec=5
