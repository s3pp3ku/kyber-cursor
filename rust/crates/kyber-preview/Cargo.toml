[package]
name = "kyber-preview"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Window-scoped native Windows cursor trial using Kyber's shared Rust frames."

[dependencies]
kyber-core = { workspace = true }
image = "0.25"
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
rodio = "0.21"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
